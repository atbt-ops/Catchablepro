{% extends "base.html" %}
{% from "macros.html" import icon %}
{% block title %}Log in · SkillMatch{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="formcard">
    <h2>Welcome back</h2>
    <p class="sub">Log in to your SkillMatch account.</p>
    {% if error %}<p class="error">{{ icon('bolt', 15) }} {{ error }}</p>{% endif %}
    <form action="/login" method="post">
      <label>Email
        <input type="email" name="email" required autofocus placeholder="you@example.com">
      </label>
      <label>Password
        <input type="password" name="password" required placeholder="••••••••">
      </label>
      <button class="btn block" type="submit">Log in</button>
    </form>
    <p class="center-note">New here? <a href="/register">Create an account</a></p>
  </div>
</div>
{% endblock %}
