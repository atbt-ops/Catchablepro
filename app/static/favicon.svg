<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Catchablepro">
  <!-- The tab icon: the same target mark and brand gradient as the header logo,
       redrawn at 32px so the rings stay legible where a scaled-down 24px icon
       would smear them together. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <circle cx="16" cy="16" r="9"/>
    <circle cx="16" cy="16" r="4.6"/>
    <circle cx="16" cy="16" r="0.9" stroke-width="2.4"/>
  </g>
</svg>
