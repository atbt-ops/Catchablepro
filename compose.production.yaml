name: catchablepro

# Production on a Windows desktop with Docker Desktop + a named Cloudflare
# Tunnel. The app itself is only published to 127.0.0.1; Cloudflare reaches it
# over Docker's private network and supplies HTTPS at PUBLIC_URL.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - catchablepro-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token.txt

volumes:
  catchablepro-data:
