version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: catchablepro-collector
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana_token:/etc/prometheus/grafana_token:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus_data:
