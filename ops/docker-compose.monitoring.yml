# The monitoring stack, in one command:
#
#   printf '%s' "$METRICS_TOKEN" > ops/prometheus/metrics_token
#   docker compose -f ops/docker-compose.monitoring.yml up -d
#
# Runs next to the app, not inside it: monitoring that dies with the thing it
# monitors reports nothing about the outage you care about. Point it at the
# deployed URL (ops/prometheus/prometheus.yml) and run it somewhere else —
# your machine while you are small, a separate host when you are not.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # The scrape credential, kept in a file so it never lands in git or in
      # `docker inspect`. Create it before the first start; it is gitignored.
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # Change this. Grafana can read every metric you collect, including the
      # shape of your traffic and your error rates.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
