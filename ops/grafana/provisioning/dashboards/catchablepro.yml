apiVersion: 1
providers:
  - name: catchablepro
    folder: ""
    type: file
    # The dashboard is a file in git, not a thing someone edited in the UI at
    # 3am and never saved. Edits made in Grafana are overwritten on restart —
    # change the JSON and commit it.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
