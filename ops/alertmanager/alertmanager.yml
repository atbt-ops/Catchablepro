# Where alerts actually go.
#
# READ THIS BEFORE YOU TRUST IT: as shipped, this file delivers nothing. The
# default receiver is empty on purpose — a fake destination that silently
# swallows pages is worse than no monitoring at all, because it looks like
# monitoring. Fill in one receiver below, then prove it by firing a test alert
# (the command is in docs/monitoring.md).
route:
  receiver: default
  group_by: [alertname, check]
  group_wait: 30s        # let a burst settle into one notification
  group_interval: 5m
  repeat_interval: 4h    # an unacknowledged page comes back
  routes:
    - matchers: [severity = "page"]
      receiver: default
      repeat_interval: 1h
    - matchers: [severity = "ticket"]
      receiver: default
      repeat_interval: 24h

receivers:
  - name: default
    # Pick one and delete this comment.
