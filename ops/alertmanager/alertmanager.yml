    #     auth_username: alerts@example.com
    #     auth_password_file: /etc/alertmanager/smtp_password

inhibit_rules:
  # The instance being down explains every other complaint about it. Suppress
  # the consequences so the notification names the cause.
  - source_matchers: [alertname = "CatchableproDown"]
    target_matchers: [severity =~ "page|ticket"]
    equal: [instance]
