# Render Blueprint — deploy Catchablepro from this repo.
# In Render: New + > Blueprint > connect this repo. Render reads this file.
services:
  - type: web
    name: catchablepro
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # free tier: no persistent disk, spins down when idle
    region: oregon
    # Readiness, not liveness: /readyz fails with 503 when the database or
    # uploads volume is broken, so Render stops routing to a dead instance.
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production   # enables Secure cookies + requires a real SECRET_KEY
      - key: SECRET_KEY
        generateValue: true # Render generates a strong random value for you

      # Email. "console" logs mail and sends nothing — fine for a demo, fatal
      # for real users, since signup verification and password resets would go
      # to the log. ENV=production refuses to boot on it unless the deploy says
      # out loud that it knows, which is what ALLOW_CONSOLE_EMAIL does.
      #
      # GOING LIVE: set EMAIL_BACKEND to "smtp" or "sendgrid" in the Render
      # dashboard, fill in the secrets below (sync: false keeps them out of
      # git), and DELETE the ALLOW_CONSOLE_EMAIL entry.
      - key: EMAIL_BACKEND
        value: console
      - key: ALLOW_CONSOLE_EMAIL
        value: "true"        # demo deploy: knowingly sends no mail
      - key: EMAIL_FROM
        value: no-reply@example.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

      # Prometheus scraping. /metrics is OFF in production until this is set,
      # because the exposition leaks route names, traffic volume and error
      # rates. Generate one and paste it into the Render dashboard:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: METRICS_TOKEN
        sync: false

    # ---------------------------------------------------------------------
    # PERSISTENCE: the free plan has no disk, so the SQLite database and any
    # uploaded resumes are LOST on every restart/redeploy. To keep data,
    # upgrade `plan` above to `starter` and uncomment the disk below.
    # ---------------------------------------------------------------------
    # disk:
    #   name: catchablepro-data
    #   mountPath: /app/data
    #   sizeGB: 1
